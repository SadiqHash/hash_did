[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "hash_did"
version = "0.1.0"
description = "Hash-DID Offline-first simple decentralized identity engine for no.IT"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "SadiqHash", email = "saddeequjp@gmail.com" }
]

keywords = [
    "decentralized-identity",
    "did",
    "verifiable-credentials",
    "offline-first",
    "cryptography",
    "privacy",
    "zk",
    "identity"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries"
]

dependencies = [
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "base58>=2.1.1",

    "pydantic>=2.6.0",

    "qrcode>=7.4.2",
    "Pillow>=10.0.0",

    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",

    "typer>=0.12.0",
    "rich>=13.7.0"
]

[tool.poetry.group.api.dependencies]
fastapi = ">=0.110.0"
uvicorn = { version = ">=0.27.0", extras = ["standard"] }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
httpx = ">=0.27.0"
ruff = ">=0.3.0"
black = ">=24.0.0"
mypy = ">=1.8.0"
pre-commit = ">=3.6.0"
pytest-cov = ">=4.1.0"

[project.scripts]
hash-did = "hash_did.interfaces.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
